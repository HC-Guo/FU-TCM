name: Repository hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  code-only-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reject datasets, secrets, non-English paths, and syntax errors
        run: python scripts/check_repository_hygiene.py
