name: Repository validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate repository structure and security rules
        run: python scripts/validate_repository.py
